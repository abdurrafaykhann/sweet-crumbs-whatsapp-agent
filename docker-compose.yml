# One command: docker compose up --build   ->  http://localhost:8000/demo
services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgresql://agent:agent@db:5432/agent
      REDIS_URL: redis://redis:6379/0
      DEMO_MODE: "1"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: agent, POSTGRES_PASSWORD: agent, POSTGRES_DB: agent }
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U agent"], interval: 3s, retries: 20 }
  redis:
    image: redis:7-alpine
volumes:
  pgdata:
