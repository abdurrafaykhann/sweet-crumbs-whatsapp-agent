# Render Blueprint (New + > Blueprint). Verify plan names/limits against current Render docs before relying on "free".
services:
  - type: web
    name: wa-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - { key: DATABASE_URL, fromDatabase: { name: wa-db, property: connectionString } }
      - { key: REDIS_URL, fromService: { type: keyvalue, name: wa-redis, property: connectionString } }
      - { key: GROQ_API_KEY, sync: false }
      - { key: WA_VERIFY_TOKEN, sync: false }
      - { key: WA_ACCESS_TOKEN, sync: false }
      - { key: WA_PHONE_NUMBER_ID, sync: false }
      - { key: WA_APP_SECRET, sync: false }
      - { key: DEMO_MODE, value: "1" }
  - type: keyvalue
    name: wa-redis
    plan: free
    ipAllowList: []
databases:
  - name: wa-db
    plan: free
